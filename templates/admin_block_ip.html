<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封鎖 IP - 本地管理介面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-shield-lock me-2"></i>
                本地管理介面
            </a>
            <div class="navbar-nav ms-auto">
                <a href="/logout" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>登出
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/dashboard">儀表板</a></li>
                <li class="breadcrumb-item"><a href="/security">安全管理</a></li>
                <li class="breadcrumb-item active">封鎖 IP</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-shield-x me-2"></i>
                            手動封鎖 IP 地址
                        </h5>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label for="ip_address" class="form-label">IP 地址 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="ip_address" name="ip_address" 
                                       placeholder="例如: 192.168.1.100" required pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$">
                                <div class="form-text">請輸入有效的 IPv4 地址</div>
                            </div>

                            <div class="mb-3">
                                <label for="reason" class="form-label">封鎖理由</label>
                                <select class="form-select" id="reason" name="reason">
                                    <option value="手動封鎖">手動封鎖</option>
                                    <option value="惡意攻擊">惡意攻擊</option>
                                    <option value="暴力破解">暴力破解</option>
                                    <option value="垃圾流量">垃圾流量</option>
                                    <option value="其他安全威脅">其他安全威脅</option>
                                </select>
                            </div>

                            <div class="alert alert-warning">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                <strong>注意：</strong>封鎖 IP 後，該地址將無法訪問系統。請確認您輸入的 IP 地址正確。
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger">
                                    <i class="bi bi-shield-x me-1"></i>封鎖 IP
                                </button>
                                <a href="/security" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-1"></i>返回
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
