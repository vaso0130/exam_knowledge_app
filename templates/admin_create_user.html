<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創建用戶 - 管理平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="bi bi-shield-check"></i> 管理平台
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('users_list') }}">
                    <i class="bi bi-arrow-left"></i> 返回用戶列表
                </a>
                <a class="nav-link" href="{{ url_for('logout') }}">
                    <i class="bi bi-box-arrow-right"></i> 登出
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-person-plus"></i> 創建新用戶
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Flash 訊息 -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'warning' }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">用戶名稱 *</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                                <div class="form-text">用戶名稱必須唯一，建議使用英文字母或數字</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">密碼 *</label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="6">
                                <div class="form-text">密碼長度至少 6 個字元</div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">角色 *</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="viewer" selected>檢視者 (Viewer)</option>
                                    <option value="admin">管理員 (Admin)</option>
                                </select>
                                <div class="form-text">
                                    <strong>檢視者</strong>：可查看和上傳內容，但無法編輯或刪除<br>
                                    <strong>管理員</strong>：擁有完整的系統管理權限
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">電子郵件 (選填)</label>
                                <input type="email" class="form-control" id="email" name="email">
                                <div class="form-text">用於未來的通知和密碼重設功能</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-person-plus"></i> 創建用戶
                                </button>
                                <a href="{{ url_for('users_list') }}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> 取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
