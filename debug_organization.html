<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試 AI 整理功能</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>測試 AI 整理功能</h1>
        
        <button type="button" class="btn btn-primary" onclick="showOrganizationSelector()">
            測試選擇整理方式
        </button>
        
        <div id="test-output" class="mt-3"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 測試函數
        function showOrganizationSelector() {
            console.log("showOrganizationSelector 被調用了！");
            
            const organizationTypes = [
                {type: 'mindmap', name: '心智圖結構化', icon: 'sitemap'},
                {type: 'hierarchical', name: '層次化重點整理', icon: 'list'},
                {type: 'feynman', name: '費曼技巧解析', icon: 'lightbulb'},
                {type: 'qa_learning', name: '問答式學習', icon: 'question'},
                {type: 'comparison', name: '對比分析整理', icon: 'balance-scale'},
                {type: 'memory_palace', name: '記憶宮殿法', icon: 'home'},
                {type: 'format_enhance', name: '格式化與補強', icon: 'magic'}
            ];
            
            let modalHtml = `
                <div class="modal fade" id="organizationModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="fas fa-magic me-2"></i>選擇整理方式</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row">
            `;
            
            organizationTypes.forEach(type => {
                modalHtml += `
                    <div class="col-md-6 mb-3">
                        <button class="btn btn-outline-primary w-100 text-start" 
                                onclick="selectOrganizationType('${type.type}', '${type.name}', '${type.icon}')">
                            <i class="fas fa-${type.icon} me-2"></i>
                            <strong>${type.name}</strong>
                        </button>
                    </div>
                `;
            });
            
            modalHtml += `
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 移除舊的 modal（如果存在）
            const oldModal = document.getElementById('organizationModal');
            if (oldModal) {
                oldModal.remove();
            }
            
            // 添加新的 modal
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // 顯示 modal
            const modal = new bootstrap.Modal(document.getElementById('organizationModal'));
            modal.show();
            
            document.getElementById('test-output').innerHTML = '<div class="alert alert-success">Modal 應該已經顯示！</div>';
        }
        
        // 測試選擇函數
        function selectOrganizationType(type, name, icon) {
            console.log("選擇了:", type, name, icon);
            
            // 關閉 modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('organizationModal'));
            if (modal) {
                modal.hide();
            }
            
            document.getElementById('test-output').innerHTML = 
                `<div class="alert alert-info">您選擇了：<strong>${name}</strong> (${type})</div>`;
        }
    </script>
</body>
</html>
